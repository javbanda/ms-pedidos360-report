
spring.application.name=ms-pedidos360-report

server.port=5000

# ==========================================
# BASE DE DATOS POSTGRESQL
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pedidos360_report}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:report_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:report_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# CONFIGURACION KAFKA - CONSUMIDOR
# ==========================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}

spring.kafka.consumer.group-id=pedidos360-reportes
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=record

# Productor para enviar mensajes fallidos a los topicos DLT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ==========================================
# TOPICOS KAFKA
# ==========================================

app.kafka.topics.estados=pedidos360.pedidos.estado
app.kafka.topics.ventas=pedidos360.pedidos.ventas
